site_name: TUSat Docs
docs_dir: tusat-docs
nav:
  - Home: index.md
  - EPS: subsystems/eps.md
  - OBC + Commu: subsystems/obc-commu.md
  - ADCS : subsystems/adcs.md
  - Payload: subsystems/payload.md
  - Ground Station: subsystems/ground-station.md
  - Example Codes: example-codes.md
  - Documents and Files: document.md
markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.blocks.caption
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
plugins:
  - glightbox
  - drawio-exporter
  - search
theme:
  name: material
  palette:
    # Palette toggle for light mode
    - scheme: default
      toggle:
        icon: material/brightness-7 # Icon for light mode
        name: Switch to dark mode
    # Palette toggle for dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4 # Icon for dark mode
        name: Switch to light mode